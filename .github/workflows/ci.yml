name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run audit:copy-a11y

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petpal-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: petpal-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  supabase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petpal-supabase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Migration numbers are unique
        run: |
          dupes=$(ls supabase/migrations | grep -oE '^[0-9]{4}' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::Duplicate migration numbers: $dupes"; exit 1; fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: petpal-supabase/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The pgTAP suite needs only Postgres and pg_prove, so every other
      # service is excluded. The Supabase CLI pulls from public.ecr.aws by
      # default, and GitHub's shared runner IPs keep exhausting that registry's
      # anonymous quota ("toomanyrequests: Data limit exceeded"). Supabase
      # publishes the same images to ghcr.io, which is GitHub's own registry
      # and is not rate limited for runners, so pull from there by default.
      # If DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set as repository
      # secrets, pull authenticated from Docker Hub instead.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
          else
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
          fi
          pnpm supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # `supabase test db` pulls the pg_prove image, so it needs the same
      # registry choice as `supabase start`.
      - run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
          else
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
          fi
          pnpm run db:test
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
