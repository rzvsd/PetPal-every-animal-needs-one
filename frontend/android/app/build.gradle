apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = System.getenv('PETPAL_RELEASE_STORE_FILE') ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv('PETPAL_RELEASE_STORE_PASSWORD') ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv('PETPAL_RELEASE_KEY_ALIAS') ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv('PETPAL_RELEASE_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def allowDebugReleaseSigning = (System.getenv('PETPAL_ALLOW_DEBUG_RELEASE_SIGNING') ?: project.findProperty('PETPAL_ALLOW_DEBUG_RELEASE_SIGNING') ?: 'false').toString().toBoolean()

// Host of the https App Link for password reset emails. Use the same value as
// the web build's REACT_APP_AUTH_LINK_HOST (see docs/auth-app-links.md).
def appLinkHost = (System.getenv('REACT_APP_AUTH_LINK_HOST') ?: project.findProperty('PETPAL_APP_LINK_HOST') ?: '').toString().trim().toLowerCase()
if (!appLinkHost) {
    if (hasReleaseSigning) {
        throw new GradleException('Set REACT_APP_AUTH_LINK_HOST (or -PPETPAL_APP_LINK_HOST) for a signed release; password reset links need it.')
    }
    logger.warn('REACT_APP_AUTH_LINK_HOST is not set; password reset links will not open the app in this build.')
    appLinkHost = 'app-link-not-configured.invalid'
}

def resolveReleaseStoreFile = { value ->
    def candidate = file(value)
    return candidate.isAbsolute() ? candidate : rootProject.file(value)
}

android {
    namespace = "com.petpal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.petpal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolveReleaseStoreFile(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [usesCleartextTraffic: "true", appLinkHost: appLinkHost]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false", appLinkHost: appLinkHost]
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                logger.warn("PETPAL_ALLOW_DEBUG_RELEASE_SIGNING=true; release artifact is signed with the debug key and is not store-ready.")
                signingConfig signingConfigs.debug
            } else {
                logger.warn("Release signing is not configured. APK/AAB output may be unsigned until frontend/android/keystore.properties or PETPAL_RELEASE_* env vars are provided.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def verifyReleaseWebAssets = tasks.register('verifyReleaseWebAssets') {
    doLast {
        def buildInfoFile = file('src/main/assets/public/petpal-build.json')
        if (!buildInfoFile.exists()) {
            throw new GradleException('Release blocked: run npm run build:production and cap sync android first.')
        }
        def buildInfo = new groovy.json.JsonSlurper().parse(buildInfoFile)
        if (buildInfo.profile != 'production' || buildInfo.allowLocalDemo != false) {
            throw new GradleException('Release blocked: production web assets must disable local demo.')
        }
    }
}
tasks.matching { it.name == 'mergeReleaseAssets' }.configureEach {
    dependsOn verifyReleaseWebAssets
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
