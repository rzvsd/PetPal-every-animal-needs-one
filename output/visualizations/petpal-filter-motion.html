<div id="petpal-motion-example">
  <style>
    #petpal-motion-example { --pp-paper:light-dark(#F8F7F4,#18201B); --pp-panel:light-dark(#FFFFFF,#242E27); --pp-ink:light-dark(#1F2924,#EDF2EC); --pp-muted:light-dark(#57645C,#B6C3B7); --pp-line:light-dark(#E4E2DC,#414C43); --pp-sage:light-dark(#E3ECE4,#354B38); color:var(--pp-ink); font-family:'DM Sans',system-ui,sans-serif; }
    #petpal-motion-example * { box-sizing:border-box; }
    #petpal-motion-example .phone { position:relative; isolation:isolate; overflow:hidden; max-width:370px; margin:8px auto; border:1px solid var(--pp-line); border-radius:28px; background:var(--pp-paper); min-height:520px; }
    #petpal-motion-example .header { display:flex; align-items:center; gap:10px; padding:22px 20px 18px; border-bottom:1px solid var(--pp-line); background:var(--pp-panel); }
    #petpal-motion-example .header strong { font-family:Outfit,system-ui,sans-serif; }
    #petpal-motion-example .content { padding:22px 20px; }
    #petpal-motion-example .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    #petpal-motion-example button { font:inherit; color:inherit; border:1px solid var(--pp-line); background:var(--pp-panel); border-radius:12px; padding:10px 14px; min-height:44px; cursor:pointer; transition:transform 100ms ease,background 150ms ease; }
    #petpal-motion-example button:active { transform:scale(.98); }
    #petpal-motion-example .filter-button { display:flex; align-items:center; gap:8px; }
    #petpal-motion-example .empty { text-align:center; margin-top:64px; display:grid; justify-items:center; gap:14px; }
    #petpal-motion-example .empty-icon { background:var(--pp-sage); padding:20px; border-radius:20px; }
    #petpal-motion-example p { color:var(--pp-muted); margin:0; }
    #petpal-motion-example .navigation { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-around; padding:18px 12px; border-top:1px solid var(--pp-line); background:var(--pp-panel); color:var(--pp-muted); }
    #petpal-motion-example .navigation span { display:grid; justify-items:center; gap:6px; }
    #petpal-motion-example .overlay { position:absolute; inset:0; z-index:2; }
    #petpal-motion-example [hidden] { display:none!important; }
    #petpal-motion-example .backdrop { position:absolute; inset:0; background:#0006; }
    #petpal-motion-example .sheet { position:absolute; bottom:0; left:0; right:0; background:var(--pp-panel); border-radius:24px 24px 0 0; padding:12px 20px 24px; }
    #petpal-motion-example .handle { width:36px; height:4px; background:var(--pp-line); border-radius:4px; margin:0 auto 10px; }
    #petpal-motion-example .sheet-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    #petpal-motion-example .close { padding:10px; display:grid; place-items:center; border:0; }
    #petpal-motion-example .choices { display:flex; gap:8px; margin:10px 0 22px; }
    #petpal-motion-example .choices button { flex:1; }
    #petpal-motion-example button[aria-pressed="true"] { background:var(--pp-sage); border-color:light-dark(#9BAE96,#8AAB87); }
    #petpal-motion-example .verified { display:flex; gap:10px; align-items:center; min-height:44px; margin-bottom:22px; }
    #petpal-motion-example input { accent-color:#2C402B; width:18px; height:18px; }
    #petpal-motion-example .apply { width:100%; color:#FFFFFF; background:#2C402B; border-color:#2C402B; }
    @media(prefers-reduced-motion:reduce) { #petpal-motion-example button { transition:none; } #petpal-motion-example button:active { transform:none; } }
  </style>
  <div class="phone">
    <div class="main">
      <div class="header"><i data-lucide="heart" aria-hidden="true"></i><strong>PetPal · Match</strong></div>
      <div class="content">
        <div class="toolbar"><strong>Discover</strong><button class="filter-button" type="button" aria-haspopup="dialog"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Filters</button></div>
        <div class="empty"><div class="empty-icon"><i data-lucide="paw-print" aria-hidden="true"></i></div><strong>Find a new friend</strong><p class="result" aria-live="polite">Dogs and cats · Bucharest</p></div>
      </div>
      <div class="navigation" aria-hidden="true"><span><i data-lucide="heart"></i>Discover</span><span><i data-lucide="message-circle"></i>Messages</span><span><i data-lucide="user"></i>Profile</span></div>
    </div>
    <div class="overlay" hidden>
      <div class="backdrop" aria-hidden="true"></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="petpal-sheet-title">
        <div class="handle" aria-hidden="true"></div>
        <div class="sheet-heading"><strong id="petpal-sheet-title">Filters</strong><button class="close" type="button" aria-label="Close filters"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <span>Who would you like to meet?</span>
        <div class="choices" role="group" aria-label="Species"><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">Dogs</button><button type="button" aria-pressed="false">Cats</button></div>
        <label class="verified"><input type="checkbox">Verified owners only</label>
        <button type="button" class="apply">Apply filters</button>
      </section>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('petpal-motion-example');
      const main = root.querySelector('.main'), overlay = root.querySelector('.overlay');
      const sheet = root.querySelector('.sheet'), backdrop = root.querySelector('.backdrop');
      const trigger = root.querySelector('.filter-button'), close = root.querySelector('.close');
      const choices = [...root.querySelectorAll('.choices button')];
      let busy = false, selected = 'All', saved = 'All', savedVerified = false;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)');
      async function move(open) {
        if (busy) return;
        busy = true;
        if (open) { overlay.hidden = false; main.inert = true; close.focus(); }
        const frames = Array.from({length:31}, (_, i) => {
          const t = i / 30, settle = (1 - (1 + 8*t)*Math.exp(-8*t)) / (1 - 9*Math.exp(-8));
          return { transform:`translateY(${100*(open ? 1-settle : settle)}%)` };
        });
        const duration = reduced.matches ? 0 : open ? 280 : 200;
        await Promise.all([
          sheet.animate(frames, {duration, fill:'both'}).finished,
          backdrop.animate([{opacity:open?0:1},{opacity:open?1:0}], {duration, fill:'both'}).finished
        ]);
        if (!open) { overlay.hidden = true; main.inert = false; trigger.focus(); }
        sheet.getAnimations().forEach(a => a.cancel());
        backdrop.getAnimations().forEach(a => a.cancel());
        busy = false;
      }
      trigger.onclick = () => {
        selected = saved;
        choices.forEach(b => b.setAttribute('aria-pressed', String(b.textContent === selected)));
        root.querySelector('input').checked = savedVerified;
        move(true);
      };
      close.onclick = () => move(false);
      backdrop.onclick = () => move(false);
      choices.forEach(button => button.onclick = () => {
        selected = button.textContent;
        choices.forEach(b => b.setAttribute('aria-pressed', String(b === button)));
      });
      root.querySelector('.apply').onclick = () => {
        if (busy) return;
        saved = selected; savedVerified = root.querySelector('input').checked;
        root.querySelector('.result').textContent = `${saved === 'All' ? 'Dogs and cats' : saved} · Bucharest${savedVerified ? ' · Verified owners' : ''}`;
        move(false);
      };
      overlay.addEventListener('keydown', event => {
        if (event.key === 'Escape') move(false);
        if (event.key !== 'Tab') return;
        const items = [...sheet.querySelectorAll('button,input')], first = items[0], last = items[items.length-1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
    })();
  </script>
</div>
